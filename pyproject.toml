[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hardtack"
version = "0.1.0"
description = "Local-first, append-only context ledger for sovereign human-AI collaboration."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Architect"}]

[project.scripts]
hardtack = "hardtack.cli:main"

[tool.setuptools.packages.find]
include = ["hardtack*"]
